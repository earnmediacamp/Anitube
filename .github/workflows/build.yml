name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AniTube.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd AniTube && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AniTube-apk
          path: AniTube/app/build/outputs/apk/release/*.apk
